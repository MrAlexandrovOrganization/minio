name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make check
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 12m
          script: |
            set -eu
            cd /home/maxim/projects/infra/minio
            test -z "$(git status --porcelain)"
            git fetch --quiet origin refs/heads/main
            test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA"
            git merge --ff-only --quiet "$DEPLOY_SHA"
            python3 -c 'import json,os; print(json.dumps({"revision":os.environ["DEPLOY_SHA"]}))' | ssh -T -o BatchMode=yes -i /home/maxim/.ssh/minio-wsl-deploy maxim@100.64.0.3
